version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn, separate PRs for anything that
      # could actually break a build.
      minor-and-patch:
        update-types: [minor, patch]
        # Pre-1.0 packages are excluded because semver calls a 0.x minor bump
        # "minor" while the ecosystem treats it as breaking. Grouping them hid
        # @anthropic-ai/sdk 0.32 -> 0.127 — ninety-five releases of the SDK the
        # AI layer calls directly — inside a PR labelled routine.
        exclude-patterns:
          - '@anthropic-ai/sdk'
          - 'lucide-react'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
