# Builds the Windows installer on a tag and attaches it to a GitHub Release.
#
# Runs on windows-latest because that is what it ships: electron-builder's NSIS
# target needs the platform it targets. The whole point of doing it here rather
# than on a laptop is that the artifact comes from a clean checkout — the 1.6.0
# incident that scripts/verifyPackage.cjs exists for was caused by source files
# being edited while electron-builder was packaging them.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write   # to create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The gates, again. A tag can be pushed from a branch CI never saw, and
      # the installer is the one artifact people actually run.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # `dist` builds the bundle, packages it, and then runs verifyPackage,
      # which extracts every packaged .cjs and parses it. A listing alone would
      # not have caught the torn archive that made it necessary.
      #
      # It passes --publish never. On a tag push electron-builder otherwise
      # decides to upload to GitHub Releases itself — "artifacts will be
      # published, reason=tag is defined" — and fails for want of a GH_TOKEN
      # after the installer has already been built successfully. Publishing is
      # the next step's job, as a draft; two things releasing the same
      # artifacts is not something to fix by handing it a token.
      - run: npm run dist

      # GITHUB_REF_NAME is the *branch* on a manual dispatch, not the tag the
      # checkout above used, so reading it directly would compare "main"
      # against the version and fail every dispatched release. Use the same
      # expression the checkout does.
      - name: Confirm the version matches the tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_REF#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "version $pkg matches the tag"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true    # so the notes can be written before anyone downloads it
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
