name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only is all any of this needs.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types need no native module and no browser, so they run on their
  # own and fail in seconds rather than behind a source build of better-sqlite3.
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vite build strips types with esbuild and never checks them, so a green
      # build proves nothing here. Typecheck has to be its own step.
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The shipped artifact is a Windows installer and the API key is held
        # by DPAPI there, so Windows is the platform that most needs testing —
        # it was the one platform never tested.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # No better-sqlite3 rebuild here, deliberately. `npm ci` installs a
      # prebuilt binary matching this job's Node, which is the ABI the tests
      # need. Forcing a source build instead is a *local* fix — it is what you
      # run after `electron-builder install-app-deps` has replaced the binary
      # with an Electron-ABI one, which cannot happen on a fresh checkout.
      # It also failed outright on windows-latest, so it was costing reliability
      # to solve a problem CI does not have. DEVELOPMENT.md covers the local case.
      # `tee` so the summary survives a threshold failure: the numbers are what
      # you need to see when it goes red, and they are the one thing a failing
      # run otherwise buries at the bottom of a log.
      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-run.txt

      - name: Report coverage
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo '```'
            sed -n '/Coverage summary/,/^=\{10,\}$/p' coverage-run.txt || true
            grep -E '^ERROR: Coverage' coverage-run.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build web bundle
        run: npm run build
      # Both workers are built from a string literal Vite reads at build time,
      # and both call sites swallow a failed worker and silently run in-process
      # instead — so a broken worker costs no test, only speed. The jsdom tests
      # exercise that fallback by design and would stay green forever. The
      # chunks' existence in the bundle is the only guard there is.
      - name: Check both workers were bundled
        shell: bash
        run: |
          for w in montecarlo.worker payoff.worker; do
            ls dist/assets/ | grep -q "$w" || { echo "$w chunk missing from the bundle"; exit 1; }
          done
          echo 'both worker chunks present'
      # The README quotes a line count and a test count. They were hand-written
      # and had drifted to 9k/305 against an actual 16k/401 — in the direction
      # that undersold the work, which is the direction nobody notices. This
      # recomputes them and fails if the committed README disagrees.
      - name: Check the README figures are current
        if: runner.os == 'Linux'
        run: npm run stats -- --check
      # A regression here is invisible until someone opens the app on a slow
      # connection, so the number is surfaced on every run.
      - name: Report bundle size
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/assets/*.js | awk '{printf "%8.1f KB  %s\n", $5/1024, $9}' | sort -rn >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
